[package]
name = "autopipe-tauri"
version = "0.1.0"
edition = "2021"
description = "AutoPipe desktop GUI (Tauri + Svelte)"

[[bin]]
name = "autopipe-tauri"
path = "src/main.rs"

[dependencies]
# Re-use everything from the existing desktop crate (config, MCP server,
# SSH, claude_config, command handlers, etc.). The package is named
# "autopipe" but its [lib] name is "autopipe_desktop" to disambiguate from
# the binary; we rename here so we can `use autopipe_desktop::commands` in
# main.rs. The `tauri-ui` feature pulls in the Tauri runtime so commands.rs
# compiles.
autopipe_desktop = { package = "autopipe", path = "../../crates/desktop", features = ["tauri-ui"] }

# Pin to the same minor version on all Tauri packages so Cargo doesn't
# resolve incompatible patch versions (the trait signatures of tauri-runtime-wry
# changed between 2.10.x and 2.11.x, causing build errors on cohabiting
# versions).
tauri = { version = "=2.1.1", features = ["tray-icon"] }
tauri-plugin-shell = "=2.0.2"
tauri-plugin-dialog = "=2.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "=2.0.6", features = [] }

[features]
# Default Tauri build feature (custom protocol on production builds).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
