[package]
name = "autopipe-tauri"
version = "0.1.0"
edition = "2021"
description = "AutoPipe desktop GUI (Tauri + Svelte)"

# Binary name controls the installed .exe filename (e.g. shown in
# Program Files, Task Manager, taskbar tooltip). Keep this aligned with
# the legacy `autopipe` CLI so users see a single "autopipe" process
# rather than the implementation detail "autopipe-tauri".
[[bin]]
name = "autopipe"
path = "src/main.rs"

[dependencies]
# Re-use everything from the existing desktop crate (config, MCP server,
# SSH, claude_config, command handlers, etc.). The package is named
# "autopipe" but its [lib] name is "autopipe_desktop" to disambiguate from
# the binary; we rename here so we can `use autopipe_desktop::commands` in
# main.rs. The `tauri-ui` feature pulls in the Tauri runtime so commands.rs
# compiles.
autopipe_desktop = { package = "autopipe", path = "../../crates/desktop", features = ["tauri-ui"] }

# Pin tauri to the same minor version as the npm @tauri-apps/api so the
# tauri-action build doesn't fail with a "version mismatched Tauri
# packages" error. Bump both at the same time when upgrading.
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = "2"

[features]
# Default Tauri build feature (custom protocol on production builds).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Forwards to autopipe_desktop/portable so cross-compile builds (e.g. Intel
# Mac from an ARM runner) can vendor OpenSSL via tauri-action `args`.
portable = ["autopipe_desktop/portable"]
