[package]
name = "autopipe"
version.workspace = true
edition.workspace = true

# Expose the desktop crate as both a library (so the Tauri binary in
# frontend/src-tauri can re-use commands.rs etc.) and the original CLI/GUI
# binary used for `cargo build -p autopipe`.
[lib]
name = "autopipe_desktop"
path = "src/lib.rs"

[[bin]]
name = "autopipe"
path = "src/main.rs"

[features]
default = []
gui = ["eframe", "tray-icon", "image", "gtk"]
# New web-based UI via Tauri 2 + Svelte. Replaces `gui` long-term.
# When enabled here it adds the Tauri runtime as a dependency so commands.rs
# compiles; the actual `tauri::Builder` lives in frontend/src-tauri.
tauri-ui = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog"]
portable = ["dep:openssl"]

[dependencies]
common = { path = "../common" }
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json"] }
ssh2 = "0.9"
base64 = "0.22"
open = "5"
chrono = "0.4"
axum = "0.8"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
openssl = { version = "0.10", features = ["vendored"], optional = true }

# GUI dependencies (optional, requires GTK on Linux)
eframe = { version = "0.31", optional = true }
tray-icon = { version = "0.19", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# Tauri-based UI dependencies (optional). Versions are pinned exactly so
# they line up with frontend/src-tauri/Cargo.toml — Cargo can otherwise
# resolve mismatched patches that break tauri-runtime-wry's trait impls.
tauri = { version = "=2.1.1", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "=2.0.2", optional = true }
tauri-plugin-dialog = { version = "=2.0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
