[package]
name = "autopipe"
version.workspace = true
edition.workspace = true

# This crate is published as both a library and a CLI binary:
#   - `autopipe_desktop` library: re-exports modules so the new Tauri
#     binary at frontend/src-tauri/ can re-use everything (config, MCP
#     server, SSH, claude_config, command handlers, etc.) without
#     duplication.
#   - `autopipe` binary: the CLI entry point used by AI clients
#     (Claude Desktop, Codex CLI) that spawn `autopipe --mcp-server`
#     and by users running `autopipe --register`/`--status`.
[lib]
name = "autopipe_desktop"
path = "src/lib.rs"

[[bin]]
name = "autopipe"
path = "src/main.rs"

[features]
default = []
# Pulls in the Tauri runtime + plugins so commands.rs compiles. The
# actual `tauri::Builder` lives in frontend/src-tauri/, which depends
# on this library with the feature enabled.
tauri-ui = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog"]
portable = ["dep:openssl"]

[dependencies]
common = { path = "../common" }
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# rustls (pure-Rust TLS) so HTTPS needs no system OpenSSL — the app runs on
# machines without Homebrew/OpenSSL installed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# On Windows, libssh2 builds against the OS-native WinCNG backend, so OpenSSL
# is not needed at all. On macOS/Linux it needs OpenSSL — vendored in below so
# the app doesn't depend on a (often absent) system/Homebrew OpenSSL.
ssh2 = "0.9"
base64 = "0.22"
open = "5"
chrono = "0.4"
axum = "0.8"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
openssl = { version = "0.10", features = ["vendored"], optional = true }
# AWS SDK for cloud auto-provisioning (Phase 1: STS identity check + S3 bucket list).
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-sdk-s3 = "1"
# reqwest (rustls-ring) and the AWS SDK's rustls connector can both want a
# process-default CryptoProvider; we install ring's once so neither panics.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Tauri-based UI dependencies (optional). Pin tauri to the same minor
# version as the npm @tauri-apps/api so tauri-action's package check
# passes; bump both at the same time when upgrading.
tauri = { version = "2.11", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

# Statically link a vendored OpenSSL for libssh2 on macOS/Linux only. Windows
# uses WinCNG (see ssh2 above) and cannot build OpenSSL from source on the CI
# runner (MSYS perl lacks the modules OpenSSL's Configure needs).
[target.'cfg(not(windows))'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
