name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast when the git tag does not match the version embedded in
  # frontend/src-tauri/tauri.conf.json. Without this gate, tauri-action
  # silently produces artifacts named after the stale conf version while
  # the GitHub Release uses the tag — leaving a v0.0.X release filled
  # with 0.0.Y-named files. Both build jobs depend on this check.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tauri.conf.json version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CONF_VER=$(jq -r '.version' frontend/src-tauri/tauri.conf.json)
          if [ "$TAG_VER" != "$CONF_VER" ]; then
            echo "::error::Version mismatch — tag=$TAG_VER but tauri.conf.json=$CONF_VER. Bump frontend/src-tauri/tauri.conf.json before tagging."
            exit 1
          fi
          echo "Version OK: tag=$TAG_VER == tauri.conf.json=$CONF_VER"

  # The CLI binary (used by AI clients that spawn `autopipe --mcp-server`
  # over stdio) is built once on Linux + Mac + Windows so users on each
  # platform can download a portable executable.
  build-cli:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: autopipe-linux-x64
            target: ""
            ext: ""
          - os: macos-latest
            artifact: autopipe-macos-arm64
            target: aarch64-apple-darwin
            ext: ""
          # Intel Mac is cross-compiled from the ARM runner. The dedicated
          # `macos-13` Intel runner has effectively zero capacity since
          # GitHub deprecated it, so jobs there hang indefinitely.
          - os: macos-latest
            artifact: autopipe-macos-x64
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            artifact: autopipe.exe
            target: ""
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.artifact }}
      - name: Build CLI binary
        shell: bash
        # Vendored OpenSSL (`--features portable`) is only needed for the
        # Intel Mac cross-compile, where the ARM runner's brew openssl is
        # the wrong architecture. Native builds use the system libssl on
        # Linux/Mac or the runner-provided OpenSSL on Windows.
        run: |
          FLAGS=""
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            FLAGS="--features portable"
          fi
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }} $FLAGS -p autopipe --bin autopipe
          else
            cargo build --release $FLAGS -p autopipe --bin autopipe
          fi
      - name: Rename binary (Unix)
        if: matrix.ext == ''
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cp target/${{ matrix.target }}/release/autopipe ${{ matrix.artifact }}
          else
            cp target/release/autopipe ${{ matrix.artifact }}
          fi
      - name: Rename binary (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: Copy-Item target/release/autopipe.exe ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # GUI app (Tauri + Svelte) bundled per-platform via tauri-action.
  # Produces: .exe (Windows), .dmg (macOS), .deb + .AppImage (Linux).
  build-tauri:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          # Intel Mac DMG is cross-compiled from the ARM runner; the
          # dedicated macos-13 runner has effectively no capacity.
          # `--features portable` pulls in vendored OpenSSL so the cross
          # build doesn't try to link against ARM brew libssl.
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --features portable"
            target: x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}
          # Skip cache save on Windows: the post-build tar+zstd step
          # silently fails on the large Tauri target dir and marks the
          # entire job as failed (which then blocks attach-cli). Cache
          # restore still works from earlier non-Windows saves.
          save-if: ${{ runner.os != 'Windows' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Attach the CLI artifacts to the GitHub release that tauri-action
  # already created (or will create). Run as long as build-cli succeeded,
  # even if a build-tauri job reported failure — the GitHub Release is
  # created by the first successful tauri-action and CLI binaries are
  # independent products that should still be published.
  attach-cli:
    needs: [build-cli, build-tauri]
    if: always() && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach CLI binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            autopipe-linux-x64
            autopipe-macos-arm64
            autopipe-macos-x64
            autopipe.exe
