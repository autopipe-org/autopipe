name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The CLI binary (used by AI clients that spawn `autopipe --mcp-server`
  # over stdio) is built once on Linux + Mac + Windows so users on each
  # platform can download a portable executable.
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: autopipe-linux-x64
            target: ""
            ext: ""
          - os: macos-latest
            artifact: autopipe-macos-arm64
            target: aarch64-apple-darwin
            ext: ""
          # Intel Mac is cross-compiled from the ARM runner. The dedicated
          # `macos-13` Intel runner has effectively zero capacity since
          # GitHub deprecated it, so jobs there hang indefinitely.
          - os: macos-latest
            artifact: autopipe-macos-x64
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            artifact: autopipe.exe
            target: ""
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.artifact }}
      - name: Build CLI binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }} -p autopipe --bin autopipe
          else
            cargo build --release -p autopipe --bin autopipe
          fi
      - name: Rename binary (Unix)
        if: matrix.ext == ''
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cp target/${{ matrix.target }}/release/autopipe ${{ matrix.artifact }}
          else
            cp target/release/autopipe ${{ matrix.artifact }}
          fi
      - name: Rename binary (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: Copy-Item target/release/autopipe.exe ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # GUI app (Tauri + Svelte) bundled per-platform via tauri-action.
  # Produces: .exe (Windows), .dmg (macOS), .deb + .AppImage (Linux).
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          # Intel Mac DMG is cross-compiled from the ARM runner; the
          # dedicated macos-13 runner has effectively no capacity.
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Attach the CLI artifacts to the GitHub release that tauri-action
  # already created (or will create).
  attach-cli:
    needs: [build-cli, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach CLI binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            autopipe-linux-x64
            autopipe-macos-arm64
            autopipe-macos-x64
            autopipe.exe
