name: Mac Notarize Test

# Throwaway workflow to prove CI-side notarization works before wiring it into
# the real Release workflow. Builds ONLY macOS (ARM), signs it (same secrets as
# Release), then notarizes + staples with the -1009 mitigation (--no-s3-
# acceleration) and retries. It does NOT create a GitHub Release — the finished
# dmg is uploaded as a workflow artifact so you can download and verify it.
#
# Trigger: push a tag like `mactest-1`, or run manually from the Actions tab.
# Requires two extra secrets that Release does not use yet:
#   APPLE_ID       — your Apple ID email
#   APPLE_PASSWORD — an app-specific password (NOT your Apple ID password)

on:
  push:
    tags: ["mactest-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-notarize-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: mactest-aarch64

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      # Build + code-sign only (no release). tauri-action imports the
      # Developer ID cert from APPLE_CERTIFICATE and signs during the build.
      - name: Build and sign (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: frontend
          args: "--target aarch64-apple-darwin"

      # Notarize the signed dmg from CI, working around the intermittent
      # -1009 (notary endpoint unreachable) with --no-s3-acceleration and a
      # retry loop, then staple so the app runs with no `xattr` step.
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(find . -name '*.dmg' 2>/dev/null | head -1 || true)
          echo "Found dmg: $DMG"
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg produced by the build"; exit 1
          fi
          echo "== Signature check =="
          codesign -dvv "$DMG" || true
          echo "== Notarize (with retries + --no-s3-acceleration) =="
          ok=0
          for i in 1 2 3; do
            if xcrun notarytool submit "$DMG" \
                 --apple-id "$APPLE_ID" \
                 --team-id "$APPLE_TEAM_ID" \
                 --password "$APPLE_PASSWORD" \
                 --no-s3-acceleration \
                 --wait; then
              ok=1; break
            fi
            echo "notarize attempt $i failed (possibly -1009); retrying in 30s..."
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "::error::notarization failed after 3 attempts"; exit 1
          fi
          echo "== Staple + verify =="
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t install "$DMG" || true

      - uses: actions/upload-artifact@v4
        with:
          name: autopipe-mac-notarized-dmg
          path: "**/*.dmg"
          if-no-files-found: error
